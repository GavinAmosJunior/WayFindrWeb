<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickPath AI - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #f4f5f7; --card-bg: #ffffff; --primary-red: #cc0000; --dark-slate: #0F172A; --text-main: #1E293B; --text-muted: #64748B; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg-color); color: var(--text-main); }
        .header { display: flex; justify-content: space-between; align-items: center; min-height: 76px; padding: 0 30px; margin-bottom: 30px; background: var(--primary-red); box-shadow: 0 3px 10px rgba(127, 0, 0, 0.2); }
        .header h1 { margin: 0; color: white; font-size: 26px; letter-spacing: 0.2px; }
        .mattel-logo-badge { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; padding: 3px; box-sizing: border-box; border-radius: 50%; background: white; box-shadow: 0 2px 5px rgba(90, 0, 0, 0.2); }
        .mattel-logo-badge img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 24px; padding: 0 30px 30px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .card h2 { margin-top: 0; font-size: 18px; color: var(--primary-red); border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        
        button { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 12px; cursor: pointer;}
        
        .toy-checkbox-container { max-height: 150px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 12px; background: white; }
        .toy-label { display: block; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .toy-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
        .toy-name-label { font-size: 14px; font-weight: 500; }
        .toy-qty-input { width: 45px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: bold; }

        .btn-add { background: var(--dark-slate); color: white; border: none; }
        .btn-assign { background: var(--primary-red); color: white; border: none; margin-top: auto; }
        
        .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .list-item { padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .queue-item-content { min-width: 0; }
        .toy-name { font-weight: bold; font-size: 14px; }
        .parts-dropdown { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
        .parts-dropdown summary { cursor: pointer; color: var(--dark-slate); font-weight: 600; }
        .parts-list { margin: 8px 0 0; padding-left: 18px; line-height: 1.6; }
        .btn-remove { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; width: auto; margin:0;}
        
        .search-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .filter-row .search-input, .filter-row select { margin-bottom: 0; }
        .filter-row select { flex: 1; padding: 8.1px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; min-width: 0; }
        .part-result-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

        .worker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .worker-card { padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; align-self: center; }
        .status-idle { background: #dcfce7; color: #166534; }
        .status-active { background: #dbeafe; color: #1e40af; }
        .worker-task { font-size: 13px; color: var(--text-muted); min-height: 20px; }
        .worker-category { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--dark-slate); background: white; }
        .worker-name { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .category-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
        .category-kitting { background: #8b5cf6; }
        .category-textile { background: #f97316; }
        .category-plastics { background: #3b82f6; }
        .btn-cancel { background: #fef2f2; color: #ef4444; border: none; padding: 6px; font-size: 11px; border-radius: 6px; margin: 0; width: 100%;}
        .analytics-card { grid-column: 1 / -1; }
        .analytics-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
        .analytics-toolbar input { width: 80px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .analytics-toolbar button { width: auto; margin: 0; background: var(--dark-slate); color: white; border: none; }
        .analytics-summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .metric { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; min-width: 130px; }
        .metric strong { display: block; font-size: 22px; color: var(--dark-slate); }
        .metric span { font-size: 12px; color: var(--text-muted); }
        .analytics-columns { display: grid; grid-template-columns: minmax(280px, 1.3fr) minmax(240px, 1fr); gap: 24px; }
        .heatmap-layout { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; align-items: stretch; }
        .locator-row-labels { position: relative; min-height: 280px; font-size: 10px; font-weight: bold; color: var(--text-muted); }
        .locator-row-label { position: absolute; right: 0; transform: translateY(-50%); }
        .heatmap { position: relative; aspect-ratio: 66 / 49; min-height: 280px; border: 1px solid #cbd5e1; background: #f8fafc; overflow: hidden; }
        .heatmap-locator { position: absolute; z-index: 0; width: 1.15%; height: 2%; transform: translate(-50%, -50%); border-radius: 2px; background: #d1d5db; }
        .heatmap-locator.hidden { visibility: hidden; }
        .heat-cell { position: absolute; z-index: 1; width: 1.7%; height: 1.7%; transform: translate(-50%, -50%); border-radius: 50%; }
        .heat-marker { position: absolute; z-index: 2; width: 14px; height: 14px; transform: translate(-50%, -50%); border: 3px solid white; border-radius: 50%; box-shadow: 0 1px 5px rgba(15, 23, 42, 0.45); }
        .heat-marker-before { background: #cc0000; }
        .heat-marker-after { background: #2563eb; }
        .heat-marker-label { position: absolute; left: 10px; top: -9px; width: max-content; max-width: 180px; padding: 3px 6px; border-radius: 4px; background: rgba(15, 23, 42, 0.92); color: white; font-size: 10px; font-weight: 700; white-space: normal; pointer-events: none; }
        .heatmap-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
        .analytics-list { max-height: 280px; overflow-y: auto; }
        .analytics-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .analytics-clickable { cursor: pointer; }
        .analytics-clickable:hover, .analytics-clickable:focus-visible { background: #f8fafc; outline: none; }
        .recommendation { padding: 10px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 7px; margin-bottom: 8px; font-size: 12px; }
        .recommendation.analytics-clickable:hover, .recommendation.analytics-clickable:focus-visible { background: #fef3c7; }
        @media (max-width: 900px) { .dashboard-grid, .analytics-columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <h1>Admin Dashboard</h1>
        <div class="mattel-logo-badge">
            <img src="assets/images-2%20Background%20Removed.png" alt="Mattel">
        </div>
    </header>
    <div class="dashboard-grid">
        
        <div class="card">
            <h2>1. Create Order</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Check the boxes for the toys you want to queue.</p>
            <div class="filter-row">
                <input type="search" id="toySearch" class="search-input" placeholder="Search toys..." oninput="filterToys()">
                <select id="toyFilter" aria-label="Filter toys" onchange="filterToys()"><option value="all">All toys</option></select>
            </div>
            <div id="toyCheckboxes" class="toy-checkbox-container"><i>Loading toys...</i></div>
            <button class="btn-add" onclick="queueOrder()">Add Selection to Queue</button>

            <h3 style="font-size: 14px; color: var(--dark-slate); margin-top: 25px; margin-bottom: 10px; border-top: 1px solid #eee; padding-top: 15px;">Manual Part Request</h3>
            <input type="text" id="skuSearch" class="search-input" placeholder="Search by SKU or Name..." oninput="searchParts()">
            <div id="partSearchResults" class="toy-checkbox-container" style="display:none; max-height: 140px;"></div>
            <button class="btn-add" style="background:#cc0000;" onclick="queueCustomParts()">Add Individual Parts to Queue</button>
        </div>

        <div class="card">
            <h2>2. Pending Queue</h2>
            <div class="list-container" id="pendingQueueList"></div>
            <button class="btn-assign" onclick="autoAssignTasks()" style="margin-top: 20px;">Assign ALL to Idle Shoppers</button>
        </div>

        <div class="card">
            <h2>3. Live Shopper Status</h2>
            <div class="filter-row">
                <input type="search" id="workerSearch" class="search-input" placeholder="Search shoppers..." oninput="filterWorkers()">
                <select id="workerCategoryFilter" aria-label="Filter shoppers by zone" onchange="filterWorkers()">
                    <option value="all">All zones</option><option value="plastics">Plastics</option><option value="kitting">Kitting</option><option value="textile">Textile</option>
                </select>
            </div>
            <div class="worker-grid" id="workerGrid"></div>
        </div>

        <div class="card analytics-card">
            <h2>4. Route Traffic Analysis</h2>
            <div class="analytics-toolbar">
                <label for="analyticsDays">Window (days)</label>
                <input id="analyticsDays" type="number" min="1" max="365" value="30">
                <button onclick="fetchAnalytics()">Refresh Analysis</button>
                <span id="analyticsStatus" style="font-size:12px;color:var(--text-muted);"></span>
            </div>
            <div id="analyticsSummary" class="analytics-summary"></div>
            <div class="analytics-columns">
                <div>
                    <strong>Warehouse traffic heatmap</strong>
                    <div class="heatmap-layout">
                        <div id="locatorRowLabels" class="locator-row-labels" aria-label="Locator rows"></div>
                        <div id="heatmap" class="heatmap" aria-label="Warehouse route traffic heatmap"></div>
                    </div>
                    <div class="heatmap-legend"><span>Low traffic</span><span>High traffic</span></div>
                </div>
                <div>
                    <strong>Most visited locators</strong>
                    <div id="hotspotList" class="analytics-list"></div>
                    <strong style="display:block;margin-top:18px;">Relocation candidates</strong>
                    <div id="recommendationList" class="analytics-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gqrgmbbpvazseucbfqkr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_42UoEaAXddNOJ_lQdgz4vA_QTyLTO-C';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const PYTHON_API_URL = 'http://localhost:8000';

        let toys = []; let pendingTasks = []; let workers = [];
        const toyQuantities = new Map();
        let allWarehouseParts = [];
        let analyticsSelection = [];

        async function initDashboard() {
            fetchAnalytics();
            await fetchToys(); 
            await fetchWarehouseParts();
            await fetchState();
            setInterval(fetchState, 3000); 
        }

        async function fetchAnalytics() {
            const days = Math.max(1, Math.min(365, Number(document.getElementById('analyticsDays').value) || 30));
            const status = document.getElementById('analyticsStatus');
            status.innerText = 'Loading...';
            try {
                const response = await fetch(`${PYTHON_API_URL}/api/analytics?days=${days}`);
                if (!response.ok) throw new Error('Analytics request failed');
                const data = await response.json();
                renderAnalytics(data);
                status.innerText = `Last ${days} days`;
            } catch (error) {
                status.innerText = 'Backend unavailable';
            }
        }

        function locatorToHeatmapPoint(locatorId) {
            const parts = locatorId.split('-');
            if (parts.length < 3) return null;
            const rowIndex = 'ABCDEFGHIJKLMNOPQRSTUVWX'.indexOf(parts[1]);
            const column = Number(parts[2]);
            if (rowIndex < 0 || !Number.isInteger(column) || column < 1 || column > 64) return null;
            return {
                left: (column <= 32 ? column : column + 1) / 66 * 100,
                top: (48 - (rowIndex * 2 + 1)) / 49 * 100,
            };
        }

        function renderHeatmapLocators(heatmap) {
            const rows = 'XWVUTSRQPONMLKJIHGFEDCBA';
            const indentedRows = new Set(['B', 'D', 'F', 'H', 'J', 'L', 'N', 'P', 'R', 'T', 'V', 'X']);
            rows.split('').forEach(rowLetter => {
                for (let column = 1; column <= 64; column++) {
                    const locator = document.createElement('span');
                    locator.className = 'heatmap-locator';
                    if (indentedRows.has(rowLetter) && (column === 1 || column === 64)) {
                        locator.classList.add('hidden');
                    }
                    const point = locatorToHeatmapPoint(`CTRA1-${rowLetter}-${column}`);
                    locator.style.left = `${point.left}%`;
                    locator.style.top = `${point.top}%`;
                    locator.title = `CTRA1-${rowLetter}-${String(column).padStart(3, '0')}`;
                    heatmap.appendChild(locator);
                }
            });
        }

        function selectAnalyticsLocators(locators) {
            analyticsSelection = locators;
            renderAnalyticsSelection();
        }

        function renderAnalyticsSelection() {
            const heatmap = document.getElementById('heatmap');
            heatmap.querySelectorAll('.heat-marker').forEach(marker => marker.remove());
            analyticsSelection.forEach(selection => {
                const point = locatorToHeatmapPoint(selection.locatorId);
                if (!point) return;
                const marker = document.createElement('span');
                marker.className = `heat-marker ${selection.markerClass || 'heat-marker-before'}`;
                marker.style.left = `${point.left}%`;
                marker.style.top = `${point.top}%`;
                marker.title = selection.label;
                const label = document.createElement('span');
                label.className = 'heat-marker-label';
                label.innerText = selection.label;
                marker.appendChild(label);
                heatmap.appendChild(marker);
            });
        }

        function bindAnalyticsSelection() {
            document.querySelectorAll('.analytics-clickable').forEach(element => {
                const select = () => {
                    if (element.dataset.locator) {
                        selectAnalyticsLocators([{
                            locatorId: element.dataset.locator,
                            label: element.dataset.locator,
                            markerClass: 'heat-marker-before',
                        }]);
                    } else {
                        selectAnalyticsLocators([
                            { locatorId: element.dataset.fromLocator, label: `Before: ${element.dataset.fromLocator}`, markerClass: 'heat-marker-before' },
                            { locatorId: element.dataset.suggestedLocator, label: `After: ${element.dataset.suggestedLocator}`, markerClass: 'heat-marker-after' },
                        ]);
                    }
                };
                element.addEventListener('click', select);
                element.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        select();
                    }
                });
            });
        }

        function formatAnalyticsTimestamp(timestamp) {
            if (!timestamp) return 'Part snapshot unavailable';
            const date = new Date(timestamp);
            return Number.isNaN(date.getTime()) ? timestamp : `Part at ${date.toLocaleString()}`;
        }

        function renderAnalytics(data) {
            const summary = data.summary;
            document.getElementById('analyticsSummary').innerHTML = `
                <div class="metric"><strong>${summary.total_routes}</strong><span>Routes generated</span></div>
                <div class="metric"><strong>${summary.total_steps}</strong><span>Grid steps walked</span></div>
                <div class="metric"><strong>${Number(summary.average_route_steps).toFixed(1)}</strong><span>Average steps / route</span></div>`;

            document.getElementById('locatorRowLabels').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWX'.split('').map((row, index) => {
                const top = (48 - (index * 2 + 1)) / 49 * 100;
                return `<span class="locator-row-label" style="top:${top}%">${row}</span>`;
            }).join('');

            const heatmap = document.getElementById('heatmap');
            analyticsSelection = [];
            heatmap.innerHTML = '';
            renderHeatmapLocators(heatmap);
            const maxVisits = Math.max(...data.heatmap.map(cell => cell.visits), 1);
            data.heatmap.forEach(cell => {
                const intensity = cell.visits / maxVisits;
                const color = `rgba(204, 0, 0, ${0.12 + intensity * 0.78})`;
                const top = (48 - cell.y) / 49 * 100;
                const cellElement = document.createElement('span');
                cellElement.className = 'heat-cell';
                cellElement.title = `${cell.visits} visits`;
                cellElement.style.left = `${cell.x / 66 * 100}%`;
                cellElement.style.top = `${top}%`;
                cellElement.style.background = color;
                cellElement.style.boxShadow = `0 0 ${4 + intensity * 8}px ${color}`;
                heatmap.appendChild(cellElement);
            });

            document.getElementById('hotspotList').innerHTML = data.hotspot_locators.length
                ? data.hotspot_locators.map(item => `<div class="analytics-row analytics-clickable" role="button" tabindex="0" data-locator="${item.locator_id}"><span><strong>${item.locator_id}</strong><br><small>${item.part_code || 'Part snapshot unavailable'}${item.part_name ? ` - ${item.part_name}` : ''}<br>${formatAnalyticsTimestamp(item.last_visited_at)}</small></span><strong>${item.visits} visits</strong></div>`).join('')
                : '<p style="color:var(--text-muted);font-size:13px;">No route history in this window.</p>';
            document.getElementById('recommendationList').innerHTML = data.recommendations.length
                ? data.recommendations.map(item => `<div class="recommendation analytics-clickable" role="button" tabindex="0" data-from-locator="${item.from_locator}" data-suggested-locator="${item.suggested_locator}"><strong>${item.from_locator}</strong> &rarr; <strong>${item.suggested_locator}</strong><br>${item.visits} visits. ${item.reason}</div>`).join('')
                : '<p style="color:var(--text-muted);font-size:13px;">No relocation candidates yet.</p>';
            bindAnalyticsSelection();
        }

        async function fetchToys() {
            const { data } = await supabaseClient.from('preset_toys')
                .select('*')
                .not('toy_name', 'ilike', 'Custom Request:%');
                
            toys = data || [];
            document.getElementById('toyFilter').innerHTML = '<option value="all">All toys</option>' + toys.map(toy => `<option value="${toy.id}">${toy.toy_name}</option>`).join('');
            renderToys();
        }

        function renderToys() {
            const container = document.getElementById('toyCheckboxes');
            const query = document.getElementById('toySearch').value.trim().toLowerCase();
            const selectedToy = document.getElementById('toyFilter').value;
            const filteredToys = toys.filter(toy =>
                (selectedToy === 'all' || String(toy.id) === selectedToy) &&
                toy.toy_name.toLowerCase().includes(query)
            );
            container.innerHTML = filteredToys.length ? filteredToys.map(toy => `
                <div class="toy-item">
                    <span class="toy-name-label">${toy.toy_name}</span>
                    <input type="number" min="0" value="${toyQuantities.get(String(toy.id)) || 0}" class="toy-qty-input" data-toy-id="${toy.id}" oninput="toyQuantities.set(this.dataset.toyId, this.value)">
                </div>`).join('') : '<div style="color:#999; font-size:12px; padding:10px;">No toys found.</div>';
        }

        function filterToys() {
            document.querySelectorAll('.toy-qty-input').forEach(input => toyQuantities.set(input.dataset.toyId, input.value));
            renderToys();
        }

        async function fetchState() {
            const { data: tasks } = await supabaseClient.from('tasks')
                .select('id, toy_id, zone, order_qty, preset_toys(toy_name)')
                .eq('status', 'Pending')
                .order('created_at', { ascending: true });
            pendingTasks = tasks || [];

            const toyIds = pendingTasks.map(task => task.toy_id);
            if (toyIds.length > 0) {
                const { data: bomData } = await supabaseClient.from('toy_bom')
                    .select('toy_id, part_code, qty_required, warehouse_parts(part_name, locator_id, category, stock_quantity)')
                    .in('toy_id', toyIds);
                    
                const partsByToy = {};
                (bomData || []).forEach(bomPart => {
                    if (!partsByToy[bomPart.toy_id]) partsByToy[bomPart.toy_id] = [];
                    partsByToy[bomPart.toy_id].push(bomPart);
                });
                
                pendingTasks.forEach(task => {
                    const allToyParts = partsByToy[task.toy_id] || [];
                    task.parts = allToyParts.filter(p => p.warehouse_parts.category === task.zone);
                });
            }
            renderQueue();

            const { data: workerData } = await supabaseClient.from('workers').select('id, worker_name, status, category').order('id', { ascending: true });
            for (let w of (workerData || [])) {
                if (w.status === 'Active') {
                    const { data: activeTask } = await supabaseClient.from('tasks').select('id, zone, order_qty, preset_toys(toy_name)').eq('worker_id', w.id).eq('status', 'In Progress').maybeSingle();
                    w.currentTaskName = activeTask ? `${activeTask.preset_toys.toy_name} (x${activeTask.order_qty}) [${activeTask.zone}]` : 'Unknown Task';
                    w.currentTaskId = activeTask ? activeTask.id : null;
                }
            }
            workers = workerData || []; 
            renderWorkers();
        }

        async function fetchWarehouseParts() {
            const { data } = await supabaseClient.from('warehouse_parts').select('part_code, part_name, stock_quantity, category');
            allWarehouseParts = data || [];
        }

        function searchParts() {
            const query = document.getElementById('skuSearch').value.toUpperCase();
            const container = document.getElementById('partSearchResults');
            
            if (query.length < 2) { container.style.display = 'none'; return; }
            
            const matches = allWarehouseParts.filter(p => 
                p.part_code.toUpperCase().includes(query) || 
                p.part_name.toUpperCase().includes(query)
            );
            
            if (matches.length === 0) {
                container.innerHTML = '<div style="color:#999; font-size:12px; padding:10px;">No parts found.</div>';
            } else {
                container.innerHTML = matches.map(p => `
                    <div class="part-result-item">
                        <div><strong>${p.part_code}</strong><br><span style="font-size:11px;color:#666;">${p.part_name}</span> <span style="font-size:11px;color:#10B981;">(${p.stock_quantity} in stock)</span></div>
                        <input type="number" min="0" value="0" class="part-qty-input" data-sku="${p.part_code}" style="width:45px; padding:6px; border:1px solid #cbd5e1; border-radius:6px; text-align:center;">
                    </div>
                `).join('');
            }
            container.style.display = 'block';
        }

        async function queueCustomParts() {
            const inputs = document.querySelectorAll('.part-qty-input');
            const selectedParts = Array.from(inputs).filter(input => parseInt(input.value) > 0);
            
            if (selectedParts.length === 0) return alert('Please enter a quantity for at least one part.');

            for (let input of selectedParts) {
                const sku = input.dataset.sku;
                const orderQty = parseInt(input.value);
                const partData = allWarehouseParts.find(p => p.part_code === sku);

                // Pre-flight stock check
                if (orderQty > partData.stock_quantity) {
                    alert(`INSUFFICIENT STOCK: Cannot order ${orderQty} of ${sku}. Only ${partData.stock_quantity} available.`);
                    return; 
                }

                const customToyName = `Custom Request: ${sku}`;

                let { data: existingToy } = await supabaseClient.from('preset_toys').select('id').eq('toy_name', customToyName).maybeSingle();
                
                let toyId;
                if (existingToy) {
                    toyId = existingToy.id;
                } else {
                    const { data: newToy } = await supabaseClient.from('preset_toys').insert([{ toy_name: customToyName }]).select('id').single();
                    toyId = newToy.id;
                    await supabaseClient.from('toy_bom').insert([{ toy_id: toyId, part_code: sku, qty_required: 1 }]);
                }

                await supabaseClient.from('tasks').insert([{
                    toy_id: toyId,
                    zone: partData.category,
                    order_qty: orderQty
                }]);
            }

            document.getElementById('skuSearch').value = '';
            document.getElementById('partSearchResults').style.display = 'none';
            inputs.forEach(input => input.value = 0);

            fetchState();
            fetchToys(); 
        }

        async function updateWorkerCategory(workerId, category) {
            const { error } = await supabaseClient.from('workers').update({ category }).eq('id', workerId);
            if (error) {
                alert(`Unable to update shopper category: ${error.message}`);
                fetchState();
            }
        }

        async function queueOrder() {
            const inputs = document.querySelectorAll('.toy-qty-input');
            const selectedToys = Array.from(inputs).filter(input => parseInt(input.value) > 0);
            
            if (selectedToys.length === 0) return alert('Please enter a quantity for at least one toy.');

            const selectedIds = selectedToys.map(input => input.dataset.toyId);

            const { data: bomData } = await supabaseClient.from('toy_bom')
                .select('toy_id, part_code, qty_required, warehouse_parts(part_name, category, stock_quantity)')
                .in('toy_id', selectedIds);

            const partDemands = {};
            
            selectedToys.forEach(input => {
                const id = input.dataset.toyId;
                const orderQty = parseInt(input.value);
                
                const toyParts = bomData.filter(b => b.toy_id == id);
                toyParts.forEach(part => {
                    const sku = part.part_code;
                    if (!partDemands[sku]) {
                        partDemands[sku] = {
                            name: part.warehouse_parts.part_name,
                            stock: part.warehouse_parts.stock_quantity,
                            demand: 0
                        };
                    }
                    partDemands[sku].demand += (part.qty_required * orderQty);
                });
            });

            const insufficientParts = [];
            for (const sku in partDemands) {
                const p = partDemands[sku];
                if (p.demand > p.stock) {
                    insufficientParts.push(`- ${p.name} (Need: ${p.demand}, Stock: ${p.stock})`);
                }
            }

            if (insufficientParts.length > 0) {
                alert("INSUFFICIENT STOCK ERROR:\nCannot create order due to missing parts:\n\n" + insufficientParts.join("\n"));
                return;
            }

            const inserts = [];
            selectedToys.forEach(input => {
                const id = input.dataset.toyId;
                const qty = parseInt(input.value); 
                
                const parts = bomData.filter(b => b.toy_id == id && b.warehouse_parts.category);
                const uniqueZones = [...new Set(parts.map(b => b.warehouse_parts.category))];
                
                uniqueZones.forEach(zone => inserts.push({ toy_id: id, zone: zone, order_qty: qty }));
            });

            if (inserts.length > 0) {
                await supabaseClient.from('tasks').insert(inserts);
            }

            inputs.forEach(input => input.value = 0);
            toyQuantities.clear();
            fetchState();
        }

        async function autoAssignTasks() {
            if (pendingTasks.length === 0) return alert('Queue is empty!');
            const idleWorkers = workers.filter(w => w.status === 'Idle');
            if (idleWorkers.length === 0) return alert('No idle shoppers available.');

            for (let task of pendingTasks) {
                const workerIndex = idleWorkers.findIndex(w => w.status === 'Idle' && w.category === task.zone);
                
                if (workerIndex !== -1) {
                    const worker = idleWorkers[workerIndex];
                    await supabaseClient.from('tasks').update({ status: 'In Progress', worker_id: worker.id }).eq('id', task.id);
                    await supabaseClient.from('workers').update({ status: 'Active' }).eq('id', worker.id);
                    worker.status = 'Active';
                }
            }
            fetchState();
        }

        async function removeTask(taskId) {
            await supabaseClient.from('tasks').delete().eq('id', taskId);
            fetchState();
        }

        async function cancelWorkerTask(workerId, taskId) {
            await supabaseClient.from('tasks').update({ status: 'Pending', worker_id: null }).eq('id', taskId);
            await supabaseClient.from('workers').update({ status: 'Idle' }).eq('id', workerId);
            fetchState();
        }

        function renderQueue() {
            const list = document.getElementById('pendingQueueList');
            const openTaskIds = new Set(
                Array.from(list.querySelectorAll('details[data-task-id][open]')).map(details => details.dataset.taskId)
            );
            if (pendingTasks.length === 0) { list.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:20px; font-size:14px;">Queue is empty.</div>'; return; }
            
            list.innerHTML = pendingTasks.map(t => `
                <div class="list-item">
                    <div class="queue-item-content">
                        <div class="toy-name">${t.preset_toys.toy_name} <span style="color:#ef4444;">(x${t.order_qty})</span> <span style="color:#2563EB;">[${t.zone ? t.zone.toUpperCase() : 'UNASSIGNED'} ZONE]</span></div>
                        <div style="font-size:11px; color:#999; margin-top:4px;">Task ID: #${t.id}</div>
                        <details class="parts-dropdown" data-task-id="${t.id}">
                            <summary>View parts (${t.parts.length})</summary>
                            ${t.parts.length ? `<ul class="parts-list">${t.parts.map(part => `<li><strong>${part.warehouse_parts.locator_id}</strong> | Pick: ${part.qty_required * t.order_qty} | SKU: ${part.part_code} - ${part.warehouse_parts.part_name} <span style="color:#10B981;">(In Stock: ${part.warehouse_parts.stock_quantity})</span></li>`).join('')}</ul>` : '<div class="parts-list">No parts found.</div>'}
                        </details>
                    </div>
                    <button class="btn-remove" onclick="removeTask(${t.id})">Remove</button>
                </div>
            `).join('');
            
            list.querySelectorAll('details[data-task-id]').forEach(details => {
                details.open = openTaskIds.has(details.dataset.taskId);
            });
        }

        function renderWorkers() {
            const grid = document.getElementById('workerGrid');
            const categoryOrder = ['plastics', 'kitting', 'textile'];
            const query = document.getElementById('workerSearch').value.trim().toLowerCase();
            const categoryFilter = document.getElementById('workerCategoryFilter').value;
            const sortedWorkers = [...workers].sort((a, b) => {
                const categoryDifference = categoryOrder.indexOf(a.category) - categoryOrder.indexOf(b.category);
                return categoryDifference || a.id - b.id;
            });
            const filteredWorkers = sortedWorkers.filter(w =>
                w.worker_name.toLowerCase().includes(query) &&
                (categoryFilter === 'all' || w.category === categoryFilter)
            );
            grid.innerHTML = filteredWorkers.length ? filteredWorkers.map(w => {
                const isActive = w.status === 'Active';
                const category = categoryOrder.includes(w.category) ? w.category : 'plastics';
                const categoryLabel = `${category[0].toUpperCase() + category.slice(1)} Zone`;
                return `
                <div class="worker-card">
                    <strong class="worker-name" title="${categoryLabel}"><span class="category-dot category-${category}" aria-hidden="true"></span>${w.worker_name}</strong>
                    <select class="worker-category" aria-label="Category for ${w.worker_name}" onchange="updateWorkerCategory(${w.id}, this.value)">
                        ${categoryOrder.map(category => `<option value="${category}" ${w.category === category ? 'selected' : ''}>${category[0].toUpperCase() + category.slice(1)} Zone</option>`).join('')}
                    </select>
                    <div class="status-badge ${isActive ? 'status-active' : 'status-idle'}">${w.status}</div>
                    <div class="worker-task">${isActive ? `Picking: ${w.currentTaskName}` : 'Waiting...'}</div>
                    ${isActive ? `<button class="btn-cancel" onclick="cancelWorkerTask(${w.id}, ${w.currentTaskId})">Cancel Assignment</button>` : ''}
                </div>
            `}).join('') : '<div style="color:var(--text-muted); font-size:13px;">No shoppers found.</div>';
        }
        function filterWorkers() { renderWorkers(); }
        window.onload = initDashboard;
    </script>
</body>
